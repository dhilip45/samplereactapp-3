services:
  mysql:
    image: mysql:8
    container_name: jobapp-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: jobdb
      MYSQL_USER: jobuser
      MYSQL_PASSWORD: jobpass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./server
    container_name: jobapp-backend
    environment:
      DB_HOST: mysql
      DB_USER: jobuser
      DB_PASSWORD: jobpass
      DB_NAME: jobdb
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
  build: ./Client
  container_name: react-frontend
  ports:
    - "3000:80"
  depends_on:
    - backend

volumes:
  mysql_data: